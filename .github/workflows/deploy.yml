name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer config.js
        run: |
          if [ -f config.js ]; then
            echo "config.js déjà présent, conservation des valeurs commitées."
          else
            echo "config.js manquant, génération depuis les variables..."
            node << 'NODE'
            const fs = require('node:fs');
            const projectId = process.env.FIREBASE_PROJECT_ID || 'quartz-family';
            const firebaseConfig = {
              apiKey: process.env.FIREBASE_API_KEY || "AIzaSyDCO2HXhRSiDgBp2zKirr6msJTX4Pt4Vyg",
              authDomain: process.env.FIREBASE_AUTH_DOMAIN || `${projectId}.firebaseapp.com`,
              projectId,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET || `${projectId}.firebasestorage.app`,
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID || '846072062010',
              appId: process.env.FIREBASE_APP_ID || '1:846072062010:web:65dd2643f7bc3470459503'
            };
            const config = {
              firebaseConfig,
              googleClientId: process.env.GOOGLE_CLIENT_ID || '',
              allowedDomain: process.env.ALLOWED_DOMAIN || 'kesako.org',
              repositoryUrl: process.env.REPOSITORY_URL || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
            };
            fs.writeFileSync(
              'config.js',
              `window.QUARTZ_CONFIG = ${JSON.stringify(config, null, 2)};\n`
            );
            NODE
          fi
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_DOMAIN: ${{ vars.ALLOWED_DOMAIN }}
          REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
